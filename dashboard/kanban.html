<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban — Oficina de Agents</title>
<meta name="description" content="Tablero Kanban read-only de las cards de la Oficina: columnas por estado, criterios de aceptación, gates y evidencia.">
<style>
  :root {
    --bg: #0B0D10;
    --surface: #14181D;
    --surface-2: #101419;
    --border: #232A32;
    --border-strong: #2F3945;
    --text: #E6EAF0;
    --muted: #8B97A6;
    --accent: #4ADE80;
    --warn: #FBBF24;
    --danger: #F87171;
    --radius: 4px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ease-in: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ── Header ─────────────────────────────────────────────────────────── */

  .app-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 20px;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }

  .app-head h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .app-head .run-meta {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.02em;
  }

  .app-head .run-meta strong { color: var(--text); font-weight: 600; }

  .counter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .counter strong { color: var(--text); font-weight: 600; }

  /* ── Toolbar ────────────────────────────────────────────────────────── */

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: 10px 14px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
  }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .field select,
  .field input {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 6px 8px;
    font-family: var(--mono);
    font-size: 12px;
    min-width: 150px;
    transition: border-color 220ms var(--ease-in);
  }

  .field select:hover,
  .field input:hover { border-color: var(--muted); }

  .field select:focus-visible,
  .field input:focus-visible,
  .btn:focus-visible,
  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: border-color 220ms var(--ease-in), transform 80ms var(--ease-in);
  }

  .btn:hover { border-color: var(--muted); }
  .btn:active { transform: scale(0.97); }
  .btn--ghost { color: var(--muted); }

  .toolbar-note {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .toolbar-note .source { color: var(--text); }

  /* ── Board ──────────────────────────────────────────────────────────── */

  .board {
    flex: 1;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(250px, 1fr);
    gap: 12px;
    padding: 14px 20px 20px;
    overflow-x: auto;
    align-items: start;
  }

  .column {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 160px;
    max-height: calc(100vh - 210px);
  }

  .column-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }

  .column-title {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--text);
  }

  .column[data-state="done"] .column-title { color: var(--accent); }
  .column[data-state="blocked"] .column-title,
  .column[data-state="escalated"] .column-title,
  .column[data-state="rework"] .column-title { color: var(--warn); }

  .column-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .column-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    overflow-y: auto;
    min-height: 88px;
    transition: background-color 220ms var(--ease-in), box-shadow 220ms var(--ease-in);
  }

  .column-body.drop-target {
    background: rgba(74, 222, 128, 0.06);
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  .column-empty {
    margin: 6px 2px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .column-hint { color: var(--border-strong); }

  /* ── Card ───────────────────────────────────────────────────────────── */

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 10px;
    cursor: pointer;
    transition: border-color 220ms var(--ease-in), transform 80ms var(--ease-in), opacity 220ms var(--ease-in);
  }

  .card:hover { border-color: var(--border-strong); }
  .card:active { transform: scale(0.99); }
  .card.dragging { opacity: 0.45; }

  .card[data-moved="true"] { border-color: var(--warn); }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .card-id {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  .badge {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 1px 5px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-transform: lowercase;
  }

  .badge--type { color: var(--muted); }

  .badge--state { text-transform: uppercase; color: var(--text); }
  .badge--state[data-state="done"] { color: var(--accent); border-color: var(--accent); }
  .badge--state[data-state="blocked"],
  .badge--state[data-state="rework"],
  .badge--state[data-state="escalated"] { color: var(--warn); border-color: var(--warn); }

  .card-title {
    margin: 5px 0 7px;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }

  .card-people {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 7px;
  }

  .person {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .person--reviewer { opacity: 0.85; }
  .person--reviewer .avatar { outline: 1px dashed var(--border-strong); outline-offset: 1px; }

  .person-name {
    max-width: 78px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .person--unassigned .person-name { color: var(--border-strong); font-style: italic; }

  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: hsl(var(--avatar-hue, 210) 26% 24%);
    color: var(--text);
    font-family: var(--mono);
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    flex: none;
  }

  .avatar--empty {
    background: transparent;
    border: 1px dashed var(--border-strong);
    color: var(--border-strong);
  }

  .rejections {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .rejections[data-rejections="0"] { color: var(--border-strong); }

  .checklist {
    list-style: none;
    margin: 0 0 7px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .check-item {
    display: flex;
    gap: 5px;
    align-items: flex-start;
    font-size: 11px;
    line-height: 1.35;
    color: var(--muted);
  }

  .check-box {
    font-family: var(--mono);
    font-size: 10px;
    width: 11px;
    flex: none;
    text-align: center;
  }

  .check-item.is-checked .check-box { color: var(--accent); }
  .check-item.is-checked .check-text { color: var(--text); }
  .check-item.is-failed .check-box { color: var(--danger); }
  .check-item.is-failed .check-text { color: var(--danger); }

  .check-text {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .check-more {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--border-strong);
    padding-left: 16px;
  }

  .check-progress {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-left: 16px;
  }

  .check-progress-label {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .check-progress-track {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .check-progress-fill {
    display: block;
    height: 100%;
    background: var(--accent);
  }

  .checklist-empty {
    margin: 0 0 7px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--border-strong);
  }

  .card-gates {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding-top: 7px;
    border-top: 1px solid var(--border);
  }

  .gate-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.04em;
    padding: 1px 5px;
    border-radius: var(--radius);
    border: 1px solid currentColor;
    white-space: nowrap;
  }

  .gate-badge .gate-key { opacity: 0.65; }

  .gate-badge--pass { color: var(--accent); }
  .gate-badge--fail { color: var(--danger); }
  .gate-badge--not-run { color: var(--warn); }
  .gate-badge--na { color: var(--muted); }

  /* ── Modal ──────────────────────────────────────────────────────────── */

  dialog#card-modal {
    width: min(920px, calc(100vw - 32px));
    max-height: calc(100vh - 48px);
    padding: 0;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    overflow: hidden;
  }

  dialog#card-modal::backdrop { background: rgba(4, 6, 8, 0.72); }

  .modal-shell { display: flex; flex-direction: column; max-height: inherit; }

  .modal-head {
    position: relative;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }

  .modal-ident { display: flex; align-items: center; gap: 8px; }

  .modal-title {
    margin: 6px 0 4px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.3;
    max-width: 62ch;
  }

  .modal-meta {
    margin: 0;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 7px;
    cursor: pointer;
    transition: color 220ms var(--ease-in), border-color 220ms var(--ease-in);
  }

  .modal-close:hover { color: var(--text); border-color: var(--muted); }

  .modal-body {
    padding: 14px 18px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .detail-section h3 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .detail-count {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text);
    letter-spacing: 0;
    margin-left: 4px;
  }

  .scope-block { margin-bottom: 8px; }

  .scope-block h4,
  .gate-block-title {
    margin: 0 0 4px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .scope-block--may h4 { color: var(--accent); }
  .scope-block--forbidden h4 { color: var(--danger); }

  .scope-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .scope-list code,
  .artifact-path,
  .chip {
    font-family: var(--mono);
    font-size: 10.5px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1px 5px;
    color: var(--text);
  }

  .scope-block--forbidden .scope-list code { color: var(--danger); }
  .scope-block--may .scope-list code { color: var(--accent); }

  .detail-meta {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    margin: 6px 0 0;
  }

  .detail-gate-text { margin: 0 0 10px; }
  .detail-gate-text code {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .gate-block { margin-bottom: 12px; }

  .gate-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }

  .gate-table th {
    text-align: left;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    padding: 4px 6px;
    border-bottom: 1px solid var(--border);
  }

  .gate-table td {
    padding: 5px 6px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    color: var(--muted);
  }

  .gate-table td code { font-family: var(--mono); font-size: 10px; color: var(--text); }

  .phase-reason {
    margin: 3px 0 0;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--warn);
  }

  .detail-acceptance {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .acceptance-item {
    border-left: 2px solid var(--border);
    padding: 2px 0 2px 9px;
  }

  .acceptance-item[data-acceptance-state="pass"] { border-left-color: var(--accent); }
  .acceptance-item[data-acceptance-state="fail"] { border-left-color: var(--danger); }
  .acceptance-item[data-acceptance-state="not_run"] { border-left-color: var(--warn); }

  .acceptance-text {
    margin: 3px 0 4px;
    font-size: 12px;
    line-height: 1.45;
    max-width: 78ch;
  }

  .acceptance-evidence-list {
    margin: 0;
    padding: 0 0 0 2px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .acceptance-evidence {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: baseline;
    font-size: 10.5px;
  }

  .acceptance-evidence code { font-family: var(--mono); font-size: 10px; color: var(--muted); }

  .detail-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .evidence-item {
    border-left: 2px solid var(--border);
    padding-left: 9px;
    font-size: 11px;
  }

  .evidence-item[data-evidence-passed="true"] { border-left-color: var(--accent); }
  .evidence-item[data-evidence-passed="false"] { border-left-color: var(--danger); }

  .evidence-ref {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text);
    word-break: break-word;
  }

  .evidence-meta {
    display: block;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 2px;
  }

  .evidence-note {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 11px;
    max-width: 78ch;
  }

  .evidence-req {
    margin: 3px 0 0;
    font-size: 10.5px;
    color: var(--border-strong);
    max-width: 78ch;
  }

  .detail-empty {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--border-strong);
    margin: 0;
    padding: 4px 0;
  }

  .artifact-list {
    margin: 0 0 8px;
    padding: 0;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
  }

  .artifact-link {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 220ms var(--ease-in);
  }

  .artifact-link:hover { border-bottom-color: var(--accent); }

  .detail-result {
    margin: 8px 0 0;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    max-width: 78ch;
    border-left: 2px solid var(--border);
    padding-left: 9px;
  }

  /* ── Footer ─────────────────────────────────────────────────────────── */

  .app-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    padding: 8px 20px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .app-foot .read-only { color: var(--warn); }

  /* ── Responsive ─────────────────────────────────────────────────────── */

  @media (max-width: 900px) {
    .board {
      grid-auto-columns: minmax(78vw, 1fr);
      padding: 12px;
    }
    .toolbar-note { margin-left: 0; width: 100%; }
    .column { max-height: none; }
    .board { max-height: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.001ms !important;
      animation-duration: 0.001ms !important;
    }
    .card, .btn, .column-body { transform: none !important; }
  }
</style>
</head>
<body>

<header class="app-head">
  <h1>Kanban de la Oficina</h1>
  <p class="run-meta" id="run-meta">cargando corrida…</p>
  <span class="counter">cards <strong id="count-total">0</strong></span>
  <span class="counter">visibles <strong id="count-visible">0</strong></span>
</header>

<div class="toolbar" role="search" aria-label="Filtros del tablero">
  <div class="field">
    <label for="filter-owner">owner</label>
    <select id="filter-owner" name="owner"><option value="all">todos</option></select>
  </div>
  <div class="field">
    <label for="filter-type">tipo</label>
    <select id="filter-type" name="type"><option value="all">todos</option></select>
  </div>
  <div class="field">
    <label for="filter-state">estado</label>
    <select id="filter-state" name="state"><option value="all">todos</option></select>
  </div>
  <div class="field">
    <label for="filter-search">buscar</label>
    <input id="filter-search" name="q" type="search" placeholder="id, título, tipo" autocomplete="off">
  </div>
  <button class="btn btn--ghost" id="reset-view" type="button">reset vista</button>
  <button class="btn btn--ghost" id="refresh-data" type="button">recargar data</button>
  <p class="toolbar-note">
    fuente <span class="source" id="data-source">snapshot embebido</span>
  </p>
</div>

<main class="board" id="board" aria-label="Tablero Kanban de cards">

  <section class="column" data-state="todo" aria-labelledby="col-todo-title">
    <div class="column-head">
      <h2 class="column-title" id="col-todo-title">TODO</h2>
      <span class="column-count" data-count="todo" aria-label="cards en TODO">0</span>
    </div>
    <div class="column-body" data-cards="todo" data-dropzone="true"></div>
  </section>

  <section class="column" data-state="in_progress" aria-labelledby="col-in_progress-title">
    <div class="column-head">

<script src="./kanban-source.js"></script>
<script>
(function () {
  "use strict"

  var Core = globalThis.KanbanSource
  var board = document.getElementById("board")
  var modal = document.getElementById("card-modal")
  var modalContent = document.getElementById("card-modal-content")
  var live = document.getElementById("live-region")
  var ownerSelect = document.getElementById("filter-owner")
  var typeSelect = document.getElementById("filter-type")
  var stateSelect = document.getElementById("filter-state")
  var searchInput = document.getElementById("filter-search")
  var sourceLabel = document.getElementById("data-source")

  var view = Core.normalizeDataset({})
  var filters = { owner: "all", type: "all", state: "all", q: "" }
  var lastFocused = null

  // ── Dataset ────────────────────────────────────────────────────────────

  function embeddedDataset() {
    var el = document.getElementById("kanban-dataset")
    if (!el) return { cards: [], agents: {} }
    try {
      return JSON.parse(el.textContent)
    } catch (err) {
      return { cards: [], agents: {} }
    }
  }

  function datasetUrl() {
    var params = new URLSearchParams(location.search)
    return params.get("data")
  }

  function describe(dataset) {
    var meta = dataset.meta || {}
    var run = document.getElementById("run-meta")
    var objective = meta.objective || "(sin objetivo registrado)"
    run.innerHTML = "run <strong>" + Core.escapeHtml(meta.runId || "—") + "</strong> · estado <strong>" +
      Core.escapeHtml(meta.status || "—") + "</strong> · " + Core.escapeHtml(objective)
  }

  function load(dataset, label) {
    view = Core.normalizeDataset(dataset)
    describe(dataset)
    sourceLabel.textContent = label
    buildFilterOptions()
    render()
  }

  function loadFrom(url, label) {
    return fetch(url, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status)
        return res.json()
      })
      .then(function (dataset) {
        load(dataset, label)
        announce("Datos recargados desde " + label)
      })
      .catch(function (err) {
        load(embeddedDataset(), "snapshot embebido (fetch falló: " + err.message + ")")
        announce("No se pudo leer " + label + ". Se usa el snapshot embebido.")
      })
  }

  function bootstrap() {
    var url = datasetUrl()
    if (url) {
      loadFrom(url, url)
    } else {
      load(embeddedDataset(), "snapshot embebido")
    }
  }

  // ── Filtros ────────────────────────────────────────────────────────────

  function option(value, label) {
    var opt = document.createElement("option")
    opt.value = value
    opt.textContent = label
    return opt
  }

  function buildFilterOptions() {
    while (ownerSelect.options.length > 1) ownerSelect.remove(1)
    var owners = {}
    view.cards.forEach(function (card) {
      if (card.owner) owners[card.owner.id] = card.owner.name
    })
    Object.keys(owners).sort().forEach(function (id) {
      ownerSelect.appendChild(option(id, owners[id] + " (" + id + ")"))
    })
    if (view.cards.some(function (card) { return !card.owner })) {
      ownerSelect.appendChild(option("unassigned", "sin asignar"))
    }

    while (typeSelect.options.length > 1) typeSelect.remove(1)
    var types = {}
    view.cards.forEach(function (card) { types[card.type] = true })
    Object.keys(types).sort().forEach(function (type) {
      typeSelect.appendChild(option(type, type))
    })

    while (stateSelect.options.length > 1) stateSelect.remove(1)
    Core.COLUMNS.forEach(function (column) {
      stateSelect.appendChild(option(column.id, column.label))
    })

    ownerSelect.value = filters.owner
    typeSelect.value = filters.type
    stateSelect.value = filters.state
  }

  function readFilters() {
    filters.owner = ownerSelect.value
    filters.type = typeSelect.value
    filters.state = stateSelect.value
    filters.q = searchInput.value.trim()
  }

  // ── Render ─────────────────────────────────────────────────────────────

  function render() {
    var groups = Core.groupByColumn(Core.filterCards(view.cards, filters))
    var active = filters.owner !== "all" || filters.type !== "all" || filters.state !== "all" || filters.q !== ""

    Core.COLUMN_IDS.forEach(function (id) {
      var body = board.querySelector('[data-cards="' + id + '"]')
      var column = Core.COLUMNS.filter(function (c) { return c.id === id })[0]
      body.innerHTML = Core.columnBodyHtml(column, groups[id])
      var counter = board.querySelector('[data-count="' + id + '"]')
      var total = view.cards.filter(function (card) { return card.state === id }).length
      counter.textContent = active ? groups[id].length + "/" + total : String(total)
    })

    var visible = Core.filterCards(view.cards, filters).length
    document.getElementById("count-total").textContent = String(view.cards.length)
    document.getElementById("count-visible").textContent = String(visible)

    var msg = visible + " de " + view.cards.length + " cards visibles"
    if (active) msg += " con filtros activos"
    live.textContent = msg
  }

  function announce(message) {
    live.textContent = message
  }

  function cardById(id) {
    for (var i = 0; i < view.cards.length; i++) {
      if (view.cards[i].id === id) return view.cards[i]
    }
    return null
  }

  // ── Modal ──────────────────────────────────────────────────────────────

  function openCard(id) {
    var card = cardById(id)
    if (!card) return
    lastFocused = document.activeElement
    modalContent.innerHTML = Core.modalHtml(card)
    if (typeof modal.showModal === "function") {
      modal.showModal()
    } else {
      modal.setAttribute("open", "open")
    }
    var closeBtn = document.getElementById("card-modal-close")
    if (closeBtn) closeBtn.focus()
    announce("Detalle de " + card.id + " abierto")
  }

  function closeModal() {
    if (typeof modal.close === "function") modal.close()
    else modal.removeAttribute("open")
    if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus()
    announce("Detalle cerrado")
  }

  document.getElementById("card-modal-close").addEventListener("click", closeModal)
  modal.addEventListener("click", function (event) {
    if (event.target === modal) closeModal()
  })
  modal.addEventListener("close", function () {
    if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus()
  })

  // ── Interacción del tablero ────────────────────────────────────────────

  board.addEventListener("click", function (event) {
    var card = event.target.closest(".card")
    if (card) openCard(card.getAttribute("data-card-id"))
  })

  board.addEventListener("keydown", function (event) {
    var card = event.target.closest ? event.target.closest(".card") : null
    if (!card) return
    if (event.key === "Enter" || event.key === " " || event.key === "Spacebar") {
      event.preventDefault()
      openCard(card.getAttribute("data-card-id"))
    }
  })

  // ── Drag & drop (visual, no persiste) ──────────────────────────────────
  // DRAG-DROP:start
  var dragged = null

  function onDragStart(event) {
    var card = event.target.closest ? event.target.closest(".card") : null
    if (!card) return
    dragged = card
    card.classList.add("dragging")
    if (event.dataTransfer) {
      event.dataTransfer.effectAllowed = "move"
      try { event.dataTransfer.setData("text/plain", card.getAttribute("data-card-id")) } catch (err) { /* noop */ }
    }
  }

  function onDragEnd() {
    if (dragged) dragged.classList.remove("dragging")
    dragged = null
    board.querySelectorAll(".column-body.drop-target").forEach(function (body) {
      body.classList.remove("drop-target")
    })
  }

  function onDragOver(event) {
    var zone = event.target.closest ? event.target.closest("[data-dropzone]") : null
    if (!zone) return
    event.preventDefault()
    if (event.dataTransfer) event.dataTransfer.dropEffect = "move"
    board.querySelectorAll(".column-body.drop-target").forEach(function (body) {
      if (body !== zone) body.classList.remove("drop-target")
    })
    zone.classList.add("drop-target")
  }

  function onDragLeave(event) {
    var zone = event.target.closest ? event.target.closest("[data-dropzone]") : null
    if (!zone) return
    if (event.relatedTarget && zone.contains(event.relatedTarget)) return
    zone.classList.remove("drop-target")
  }

  // El drop solo mueve el nodo en el DOM. No hay red ni storage: el tablero
  // es read-only por contrato, y un reload descarta cualquier movimiento.
  function onDrop(event) {
    var zone = event.target.closest ? event.target.closest("[data-dropzone]") : null
    if (!zone || !dragged) return
    event.preventDefault()
    var card = dragged
    var targetState = zone.getAttribute("data-cards")
    var originState = card.getAttribute("data-state")
    var originBody = card.parentElement
    zone.appendChild(card)
    card.setAttribute("data-visual-state", targetState)
    card.setAttribute("data-moved", targetState !== originState ? "true" : "false")
    var note = card.querySelector(".card-moved-note")
    if (targetState !== originState) {
      if (!note) {
        note = document.createElement("p")
        note.className = "card-moved-note check-more"
        note.textContent = "movida visualmente desde " + originState + " (no persiste)"
        card.appendChild(note)
      } else {
        note.textContent = "movida visualmente desde " + originState + " (no persiste)"
      }
    } else if (note) {
      note.remove()
    }
    if (originBody) originBody.classList.remove("drop-target")
    zone.classList.remove("drop-target")
    dragged = null
    refreshCountsFromDom()
    announce("Card " + card.getAttribute("data-card-id") + " movida a " + targetState + " (cambio visual, no se guarda)")
  }
  // DRAG-DROP:end

  function refreshCountsFromDom() {
    Core.COLUMN_IDS.forEach(function (id) {
      var body = board.querySelector('[data-cards="' + id + '"]')
      var count = body ? body.querySelectorAll(".card").length : 0
      var counter = board.querySelector('[data-count="' + id + '"]')
      if (counter) counter.textContent = String(count)
    })
  }

  board.addEventListener("dragstart", onDragStart)
  board.addEventListener("dragend", onDragEnd)
  board.addEventListener("dragover", onDragOver)
  board.addEventListener("dragleave", onDragLeave)
  board.addEventListener("drop", onDrop)

  // ── Wiring de filtros ──────────────────────────────────────────────────

  function onFilterChange() {
    readFilters()
    render()
  }

  ownerSelect.addEventListener("change", onFilterChange)
  typeSelect.addEventListener("change", onFilterChange)
  stateSelect.addEventListener("change", onFilterChange)
  searchInput.addEventListener("input", onFilterChange)

  document.getElementById("reset-view").addEventListener("click", function () {
    filters = { owner: "all", type: "all", state: "all", q: "" }
    ownerSelect.value = "all"
    typeSelect.value = "all"
    stateSelect.value = "all"
    searchInput.value = ""
    render()
    announce("Vista restablecida: movimientos visuales descartados")
  })

  document.getElementById("refresh-data").addEventListener("click", function () {
    var url = datasetUrl()
    if (url) loadFrom(url, url)
    else load(embeddedDataset(), "snapshot embebido")
  })

  bootstrap()
})()
</script>
</body>
</html>
