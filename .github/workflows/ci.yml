name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Verificar que el paquete se puede empaquetar
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm pack --dry-run

  docs:
    name: la documentacion esta al dia
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # Las cifras de la documentacion se calculan del codigo real. Si el
      # codigo cambio y la doc no, el build falla: es la unica forma de que
      # un numero escrito a mano no se desactualice en silencio.
      - name: Verificar que la documentacion coincide con el codigo
        run: npm run docs:check

      # El benchmark de seleccion mide si el matcher le gana a las
      # alternativas simples. Si deja de ganar, el CI lo dice: la
      # complejidad del matcher tiene que justificarse con numeros.
      - name: Benchmark de seleccion de agentes
        run: |
          git clone --depth 1 https://github.com/msitarzewski/agency-agents.git "$RUNNER_TEMP/agency-agents"
          cd "$RUNNER_TEMP/agency-agents"
          git checkout 4e3ac3ca6604c75113f52c695dbddcc7af928b46
          AGENCY_ROOT="$RUNNER_TEMP/agency-agents" npx tsx benchmarks/selection/run.ts

      # Y se sube el diff, para que el PR muestre que cambi�.
      - name: Mostrar el diff de la documentacion
        if: failure()
        run: |
          npx tsx scripts/sync-docs.ts || true
          git --no-pager diff -- README.md docs/ || true

  smoke:
    name: smoke del CLI
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: init + status + board
        run: |
          node dist/cli.js init "verificaci�n de humo" --directory "$RUNNER_TEMP/demo"
          node dist/cli.js status --directory "$RUNNER_TEMP/demo"
          node dist/cli.js board --directory "$RUNNER_TEMP/demo"

      - name: install en un target limpio
        run: |
          node dist/cli.js install --target "$RUNNER_TEMP/opencode" --json
          test -f "$RUNNER_TEMP/opencode/plugins/oficina.js"
          test -f "$RUNNER_TEMP/opencode/skills/oficina/SKILL.md"
          test -d "$RUNNER_TEMP/opencode/agents"

  install-verify:
    name: instalacion real del paquete
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Empaquetar e instalar en proyecto temporal
        run: |
          npm pack
          PKG=$(ls oficina-opencode-*.tgz | head -1)
          mkdir -p "$RUNNER_TEMP/test-install"
          cd "$RUNNER_TEMP/test-install"
          echo '{"name":"test","type":"module"}' > package.json
          npm install "$OLDPWD/$PKG"
          # Install optional peer dependency for v1 entry point
          npm install @opencode-ai/plugin@^1.15.11
          node -e "
            import oficina from 'oficina-opencode';
            import v1 from 'oficina-opencode/v1';
            console.log('exports ok:', Object.keys(oficina), 'v1 is function:', typeof v1 === 'function');
          "
          # Verify CLI binary works
          npx oficina --help
          npx oficina status --json
        shell: bash