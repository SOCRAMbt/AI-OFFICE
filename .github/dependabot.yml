version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # TODO el bump de npm en un solo PR semanal; majors los revisa vos igual de uno
      npm-all:
        update-types:
          - "major"
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # mismo criterio: un PR por semana por Actions; menos inbox de notificaciones
      actions-all:
        update-types:
          - "major"
          - "minor"
          - "patch"
