<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI-OFFICE — una oficina de agentes para OpenCode">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#22a06b"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="heroText" x1="120" y1="60" x2="880" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5f5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#1c2333" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="240" rx="18" fill="#0b0f19"/>
  <rect width="1000" height="240" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="999" height="239" rx="17.5" stroke="#232b3e"/>

  <!-- desk motif: a minimal "office" abstract -->
  <g opacity="0.9">
    <rect x="856" y="150" width="7" height="62" rx="3" fill="#22a06b"/>
    <rect x="869" y="132" width="7" height="80" rx="3" fill="#7c3aed"/>
    <rect x="882" y="164" width="7" height="48" rx="3" fill="#f59e0b"/>
    <rect x="808" y="204" width="170" height="8" rx="4" fill="#1c2333"/>
    <circle cx="823" cy="132" r="9" stroke="#3b4664" stroke-width="2"/>
    <rect x="808" y="146" width="30" height="4" rx="2" fill="#2a3350"/>
  </g>

  <g opacity="0.65">
    <circle cx="92" cy="196" r="3" fill="#7c3aed"/>
    <circle cx="110" cy="196" r="3" fill="#22a06b"/>
    <circle cx="128" cy="196" r="3" fill="#f59e0b"/>
  </g>

  <text x="72" y="104" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="4" fill="url(#heroText)">AI-OFFICE</text>
  <rect x="74" y="126" width="212" height="4" rx="2" fill="url(#accent)"/>

  <text x="74" y="168" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" fill="#9aa4b2">Una oficina de agentes para OpenCode donde el trabajo</text>
  <text x="74" y="198" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" fill="#9aa4b2">no se detiene cuando el modelo dice «terminé».</text>
</svg>
